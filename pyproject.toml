[project]
name = "pconfbackend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.5.7",
    "bcrypt>=4.3.0",
    "fastapi-filter>=2.0.1",
    "fastapi[standard]>=0.115.12",
    "jinja2>=3.1.6",
    "mongoengine>=0.29.1",
    "motor>=3.7.1",
    "openai>=1.68.2",
    "openai-agents>=0.0.12",
    "passlib[bcrypt]>=1.7.4",
    "pika>=1.3.2",
    "pika-stubs>=0.1.3",
    "pydantic-extra-types>=2.10.5",
    "pymongo>=4.11.3",
    "python-dotenv>=1.1.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "typesense>=1.1.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=9.0.2",
]

[tool.pyright]
venvPath = "."
